<body class="recruit-page">

  <header>
    <div class="header_left">
      <h1>
        <a href="../">
          <img src="../images/logo.svg" alt="イベント・ライブ・コンサートの運営なら株式会社アライン">
        </a>
      </h1>
    </div>

    <div class="header_right">
      <button class="hamburger" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <div class="overlay"></div>

      <nav class="menu_wrap">
        <div class="item">
          <a href="../#business">事業内容</a>
        </div>
        <div class="item">
          <a href="../#overview">会社概要</a>
        </div>
        <div class="item contact">
          <a href="#">スタッフ募集</a>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section id="recruit-main">
      <div class="wrap">
        <h2>スタッフ募集</h2>
        <p class="recruit-main__en">RECRUIT FORM</p>
        <!-- <p class="recruit-main__lead">
          イベント・ライブ・コンサートの現場を一緒に支えてくれるスタッフを募集しています。<br>
          未経験の方も、まずはお気軽にご応募ください。
        </p> -->
      </div>
    </section>

    <section id="recruit-form">
      <div class="wrap2">

        <div class="form-intro">
          <p>
            下記フォームに必要事項をご入力のうえ、送信してください。<br>
            内容を確認後、担当者よりご連絡いたします。
          </p>
        </div>

        <form class="entry-form" action="send.php" method="post">
          <input type="hidden" name="form-name" value="recruit">

          <p class="hidden">
            <label>
              入力しないでください
              <input name="bot-field">
            </label>
          </p>

          <div class="form-item">
            <label for="name">
              お名前
              <span>必須</span>
            </label>
            <input type="text" id="name" name="name" placeholder="例：山田 太郎" required>
          </div>

          <div class="form-item">
            <label for="kana">
              フリガナ
              <span>必須</span>
            </label>
            <input type="text" id="kana" name="kana" placeholder="例：ヤマダ タロウ" required>
          </div>

          <div class="form-item">
            <label for="tel">
              電話番号
              <span>必須</span>
            </label>
            <input type="tel" id="tel" name="tel" placeholder="例：090-0000-0000" required>
          </div>

          <div class="form-item">
            <label for="email">
              メールアドレス
              <span>必須</span>
            </label>
            <input type="email" id="email" name="email" placeholder="例：sample@example.com" required>
          </div>

          <div class="form-item">
            <label for="area">
              お住まいのエリア
            </label>
            <input type="text" id="area" name="area" placeholder="例：東京都豊島区">
          </div>

          <div class="form-item">
            <label for="work">
              希望する働き方
              <span>必須</span>
            </label>
            <select id="work" name="work" required>
              <option value="">選択してください</option>
              <option value="土日中心で働きたい">土日中心で働きたい</option>
              <option value="平日も働きたい">平日も働きたい</option>
              <option value="短期・単発で働きたい">短期・単発で働きたい</option>
              <option value="継続的に働きたい">継続的に働きたい</option>
              <option value="まだ決まっていない">まだ決まっていない</option>
            </select>
          </div>

          <div class="form-item">
            <label for="experience">
              イベントスタッフ経験
            </label>
            <select id="experience" name="experience">
              <option value="">選択してください</option>
              <option value="経験あり">経験あり</option>
              <option value="未経験">未経験</option>
            </select>
          </div>

          <div class="form-item">
            <label for="message">
              自己PR・質問など
            </label>
            <textarea id="message" name="message" placeholder="勤務可能日、経験、質問などがあればご記入ください。"></textarea>
          </div>

          <div class="form-check">
            <input type="checkbox" id="privacy" name="privacy" value="同意する" required>
            <label for="privacy">個人情報の取り扱いに同意する</label>
          </div>

          <div class="form-submit">
            <button type="submit">送信する</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <div class="footer_wrap">

    </div>
